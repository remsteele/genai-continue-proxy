%YAML 1.1
---
name: DoW Config
version: 1.0.0
schema: v1

# This is the local Continue Proxy, which forwards requests to genai.mil.
.credentials: &credentials
  apiBase: "http://127.0.0.1:8000/v1"
  apiKey: "local-proxy"

models:
  - name: "Gemini 3.8 Flash"
    provider: openai
    model: "gemini-3.8-flash"
    <<: *credentials
    roles:
      - chat
      - edit
      - apply
