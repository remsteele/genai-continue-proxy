%YAML 1.1
---
name: DoW Config
version: 1.0.0
schema: v1

# This is the local Continue Proxy, which forwards requests to genai.mil.
.credentials: &credentials
  apiBase: "http://127.0.0.1:8000/v1"
  apiKey: "local-proxy"

models:
  - name: "Gemini 3.8 Flash"
    provider: openai
    model: "gemini-3.8-flash"
    <<: *credentials
    roles:
      - chat
      - edit
      - apply

rules:
  - |
    Using the tools available to you, accomplish this task. Read through the code until you feel confident, then edit the code yourself using tools.
    I promise you do have tools. Look at the first message I sent and attempt to use the tools it describes. Do not tell me you don't have tools until you attempt to use those. 
    I promise it will work. DO NOT RESPOND AND SAY YOU DONT HAVE TOOL ACCESS. Just try it first.